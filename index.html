<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nossa História ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .container {
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 420px;
      z-index: 2;
    }

    .rose {
      font-size: 70px;
      animation: abrirRosa 2s ease forwards;
    }

    @keyframes abrirRosa {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(20deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    .foto {
      width: 100%;
      border-radius: 15px;
      margin-top: 15px;
      opacity: 0;
      transition: opacity 1s;
    }

    .message {
      margin-top: 15px;
      font-size: 17px;
      min-height: 50px;
    }

    .time {
      margin-top: 10px;
      font-weight: bold;
      color: #e91e63;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background: #c2185b;
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.5s;
    }

    .popup.active {
      opacity: 1;
      pointer-events: all;
    }

    .popup-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 300px;
    }

    .popup-content h2 {
      color: #e91e63;
    }

    .heart {
      position: absolute;
      color: #ff4d6d;
      animation: subir 5s linear infinite;
    }

    @keyframes subir {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="rose">🌹</div>

  <img id="foto" class="foto" src="foto1.jpeg">

  <div class="message" id="mensagem"></div>
  <div class="time" id="tempo"></div>

  <button class="btn" onclick="abrirPopup()">Clique aqui ❤️</button>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <h2>Laura, meu grande amor 💖</h2>
    <p>Você quer viver isso pra sempre comigo? 💍</p>
    <button class="btn" onclick="fecharPopup()">Sim ❤️</button>
  </div>
</div>

<script>
  const nome = "Laura, meu grande amor";
  const dataInicio = new Date("2025-12-14");

  const historia = [
    { foto: "foto1.jpeg", texto: `O começo de tudo com você, ${nome} ❤️` },
    { foto: "foto2.jpeg", texto: `Cada momento ao seu lado é especial 💖` },
    { foto: "foto3.jpeg", texto: `A gente construindo nossa história juntos ✨` },
    { foto: "foto4.jpeg", texto: `Eu escolheria você mil vezes 💘` },
    { foto: "foto5.jpeg", texto: `E ainda temos muito pra viver juntos ❤️` }
  ];

  let index = 0;

  function atualizarHistoria() {
    const img = document.getElementById("foto");
    const msg = document.getElementById("mensagem");

    img.style.opacity = 0;

    setTimeout(() => {
      index = (index + 1) % historia.length;
      img.src = historia[index].foto;
      msg.innerText = historia[index].texto;
      img.style.opacity = 1;
    }, 500);
  }

  setInterval(atualizarHistoria, 4000);

  function atualizarTempo() {
    const agora = new Date();
    let diff = agora - dataInicio;

    const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
    diff -= dias * (1000 * 60 * 60 * 24);

    const horas = Math.floor(diff / (1000 * 60 * 60));
    diff -= horas * (1000 * 60 * 60);

    const minutos = Math.floor(diff / (1000 * 60));
    diff -= minutos * (1000 * 60);

    const segundos = Math.floor(diff / 1000);

    document.getElementById("tempo").innerText =
      `Juntos há ${dias} dias, ${horas}h ${minutos}m ${segundos}s ❤️`;
  }

  setInterval(atualizarTempo, 1000);
  atualizarTempo();

  function criarCoracao() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }

  setInterval(criarCoracao, 500);

  function abrirPopup() {
    document.getElementById("popup").classList.add("active");
  }

  function fecharPopup() {
    document.getElementById("popup").classList.remove("active");
  }
</script>

</body>
</html>
